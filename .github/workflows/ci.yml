# ==============================================================================
# portal-ai-server CI 파이프라인 (PR 체크 전용 — 배포 X)
# ==============================================================================
# 트리거:
#   - dev 브랜치로 PR 올라갈 때 (체크 only)
#   - workflow_dispatch (수동)
#
# 검증 항목:
#   1. ruff lint + format 체크
#   2. pytest
#   3. Dockerfile 빌드 가능 여부 (push X)
# ==============================================================================

name: ✅ CI

on:
  pull_request:
    branches:
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"

  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 연속 push 시 이전 런 취소
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.7.x"
          enable-cache: true

      - name: Python 셋업
        run: uv python install 3.13

      - name: 의존성 설치
        run: uv sync --frozen

      - name: ruff 린트
        run: uv run ruff check .

      - name: ruff 포맷 체크
        run: uv run ruff format --check .

      - name: pytest
        run: uv run pytest -q

  docker-build:
    name: Docker 빌드 (push X)
    runs-on: ubuntu-24.04-arm
    needs: lint-and-test

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Dockerfile 빌드 가능 여부 검증
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/arm64
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
