[project]
name = "kiko-ai-server"
version = "0.1.0"
description = "kiko.ai AI Server — FastAPI 기반 패션 추천 검색/리파인 파이프라인"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28",
    "orjson>=3.10",
    "supabase>=2.10",
    # SPEC-OBSERVABILITY-002 — v3 SDK. langchain integration bundled as `langfuse.langchain` (no separate dist).
    "langfuse>=3,<4",
    # SPEC-AGENT-001: LangGraph + LangChain (Telegram 봇 conversational graph)
    # langgraph 1.x 는 langchain-core 1.3+ 를 요구한다 (현행 PyPI 기준). SPEC plan.md 의 langchain-core>=0.3 은 이전 메이저
    # 기준으로 작성된 것이라 LangGraph 1.x 와 동시 만족이 불가능 — 핵심 아키텍처 요건(LangGraph 1.x)을 우선해서 langchain-core 를 1.x 로 둔다.
    "langgraph>=1.1.10,<2.0.0",
    "langchain-core>=1.3,<2.0",
    "langchain-openai>=0.3,<1.0",
    # langchain meta-package — kept for explicit langchain-core 1.x compatibility with langgraph 1.x.
    "langchain>=1.0,<2.0",
    "python-dotenv>=1.0.1",
    "openai>=2.34.0",
    "umap-learn>=0.5.12",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.18.4",
    # SPEC-CHAT-STATE-REDIS-001 — externalize chat-state (pager cursor + impression dedupe) to Redis.
    "redis>=5.0",
    # SPEC-AUTH-SOCIAL-001 — Google/Apple social login verification
    "google-auth>=2.29",
    "python-jose[cryptography]>=3.3",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "testcontainers[postgres]>=4.14.2",
    # SPEC-CHAT-STATE-REDIS-001 — in-process redis simulator for unit/integration tests.
    "fakeredis>=2.0",
    "pytest-cov>=7.1.0",
]

# 로컬 배치 임베딩 (`scripts/embed_batch_local.py`) 전용 — 운영 이미지에는 포함 X
# 설치: `uv sync --group embed` (~5GB 다운로드, Mac M-series 는 MPS 자동 사용)
embed = [
    "torch>=2.4",
    "open-clip-torch>=2.26",
    "Pillow>=10.0",
    "tqdm>=4.60",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

# 브랜드 텍스트 임베딩 (`scripts/embed_brands_text.py`) 전용.
# BGE-m3 multilingual (KO/EN 강함) → brand_nodes.embedding (1024-dim, L2-normalized).
# 설치: `uv sync --group embed-text` (~2GB 첫 다운로드, Mac M-series 는 MPS 자동 사용)
embed-text = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "tqdm>=4.60",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# SPEC-VISION-UNIFY-001 — Vision Pydantic models mirror kikoai/app's camelCase
# JSON contract (analyze.ts). Renaming would break parity with the verbatim
# system prompt and the schema documented in run-vision.ts.
"app/channels/vision.py" = ["N815"]
# vision_prompt.py is a byte-for-byte port of kikoai/app/src/lib/prompts/analyze.ts.
# Line-length / style enforcement would force divergence from the source contract.
"app/channels/vision_prompt.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "no_evaluator_fail_open: opt out of the autouse evaluator-LLM stub (SPEC-AGENTIC-CRITIQUE-001)",
]
