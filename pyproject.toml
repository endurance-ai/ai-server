[project]
name = "portal-ai-server"
version = "0.1.0"
description = "Portal.ai AI Server — FastAPI 기반 패션 추천 검색/리파인 파이프라인"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28",
    "orjson>=3.10",
    "supabase>=2.10",
    # Langfuse server (docker-compose) 가 v2 이미지 — Python SDK 도 v2 로 pin (v3 SDK 는 ingestion endpoint 변경됨 → 404)
    "langfuse>=2.50,<3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

# 로컬 배치 임베딩 (`scripts/embed_batch_local.py`) 전용 — 운영 이미지에는 포함 X
# 설치: `uv sync --group embed` (~5GB 다운로드, Mac M-series 는 MPS 자동 사용)
embed = [
    "torch>=2.4",
    "open-clip-torch>=2.26",
    "Pillow>=10.0",
    "tqdm>=4.60",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
