<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>큐레이션 구좌 어드민</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#16181d; --mut:#6b7280; --line:#e5e7eb; --acc:#2563eb; --warn:#b45309; --bad:#dc2626; --ok:#059669; --card:#f9fafb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --fg:#e8eaed; --mut:#9aa0aa; --line:#272b33; --acc:#60a5fa; --warn:#fbbf24; --bad:#f87171; --ok:#34d399; --card:#171a20; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--fg); font:14px/1.55 ui-sans-serif,-apple-system,"Apple SD Gothic Neo",Segoe UI,Roboto,sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--mut); margin-bottom:20px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  input, select, textarea, button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:6px 9px; }
  textarea { width:100%; min-height:84px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  button { cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
  button.danger { color:var(--bad); border-color:var(--bad); }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mut); font-weight:600; font-size:12px; }
  tr.off td { opacity:.45; }
  td.num, th.num { text-align:right; }
  .tag { display:inline-block; padding:1px 7px; border-radius:99px; font-size:11px; border:1px solid var(--line); }
  .tag.trending { color:var(--acc); border-color:var(--acc); }
  .warn { color:var(--warn); } .bad { color:var(--bad); } .ok { color:var(--ok); }
  .panel { border:1px solid var(--line); border-radius:10px; padding:16px; margin-top:20px; background:var(--card); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
  label { display:block; font-size:12px; color:var(--mut); margin-bottom:4px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .thumb { width:84px; font-size:11px; color:var(--mut); }
  .thumb img { width:84px; height:112px; object-fit:cover; border-radius:6px; border:1px solid var(--line); display:block; }
  .thumb.bad img { outline:2px solid var(--bad); }
  .msg { margin-left:auto; color:var(--mut); }
  .hint { color:var(--mut); font-size:12px; margin-top:6px; }
</style>
</head>
<body>
<h1>큐레이션 구좌 어드민</h1>
<div class="sub">저장하면 곧바로 <code>GET /v1/curation</code> 에 반영됩니다. auto 구좌의 상품은 리프레셔가 매일 계산하므로 편집할 수 없습니다.</div>

<div class="bar">
  <input id="token" type="password" placeholder="X-Internal-Token" style="width:230px" />
  <select id="gender"><option value="women">여성</option><option value="men">남성</option></select>
  <button id="reload" class="primary">불러오기</button>
  <button id="newSection">＋ 새 구좌</button>
  <span class="msg" id="msg"></span>
</div>

<table>
  <thead><tr>
    <th class="num">순서</th><th>구좌 ID</th><th>종류</th><th>디자인</th><th>제목</th>
    <th class="num">등록</th><th class="num">노출</th><th>활성</th><th></th>
  </tr></thead>
  <tbody id="rows"><tr><td colspan="9" style="color:var(--mut)">토큰을 넣고 불러오기를 누르세요.</td></tr></tbody>
</table>
<div class="hint" id="previewHint"></div>

<div class="panel" id="editor" hidden>
  <div class="row" style="margin-bottom:12px">
    <strong id="editorTitle">구좌 편집</strong>
    <button id="closeEditor" style="margin-left:auto">닫기</button>
  </div>
  <div class="grid">
    <div><label>구좌 ID (소문자·숫자·하이픈)</label><input id="f_section_id" placeholder="editorial-summer-vacation" /></div>
    <div><label>성별</label><select id="f_gender"><option value="women">여성</option><option value="men">남성</option></select></div>
    <div><label>종류</label><select id="f_slot_type"><option value="editorial">editorial (직접 고름)</option><option value="auto">auto (리프레셔 계산)</option></select></div>
    <div><label>디자인</label><select id="f_display_type"><option value="default">default (기본 그리드)</option><option value="trending">trending (트렌딩 전용)</option></select></div>
    <div><label>제목</label><input id="f_title" /></div>
    <div><label>서브타이틀</label><input id="f_subtitle" /></div>
    <div><label>순서 (작을수록 위)</label><input id="f_sort_order" type="number" min="0" max="9999" /></div>
    <div><label>활성</label><div class="row" style="padding-top:6px"><input id="f_is_active" type="checkbox" /> <span>앱에 노출</span></div></div>
  </div>
  <div style="margin-top:14px">
    <label>상품 ID (쉼표/공백/줄바꿈 구분, 앞 20개가 노출됨)</label>
    <textarea id="f_product_ids" placeholder="713929, 673348, 672995 …"></textarea>
    <div class="row" style="margin-top:8px">
      <button id="checkProducts">상품 확인</button>
      <button id="save" class="primary">저장</button>
      <button id="del" class="danger">삭제</button>
      <span class="msg" id="editorMsg"></span>
    </div>
    <div class="hint" id="autoHint" hidden>auto 구좌입니다 — 상품 목록은 저장해도 반영되지 않습니다 (리프레셔 소유).</div>
    <div class="thumbs" id="thumbs"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = "kiko-admin-token";
$("token").value = sessionStorage.getItem(KEY) || "";
$("token").addEventListener("change", () => sessionStorage.setItem(KEY, $("token").value.trim()));

async function api(path, options = {}) {
  const res = await fetch("/admin/curation" + path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Internal-Token": $("token").value.trim(), ...(options.headers || {}) },
  });
  if (!res.ok) throw new Error((await res.text()).slice(0, 300));
  return res.json();
}

let rows = [];

function note(el, text, cls = "") { el.className = "msg " + cls; el.textContent = text; }

async function load() {
  const gender = $("gender").value;
  note($("msg"), "불러오는 중…");
  try {
    const [list, preview] = await Promise.all([
      api("/sections?gender=" + gender),
      api("/preview?gender=" + gender),
    ]);
    rows = list.sections;
    const shown = Object.fromEntries(preview.sections.map((s) => [s.section_id, s.shown]));
    render(shown);
    note($("msg"), `${rows.length}개 구좌`, "ok");
    $("previewHint").textContent = "노출 = 앞 구좌와 겹치는 상품을 뺀 실제 카드 수입니다. 등록보다 적으면 앞 구좌가 먼저 가져간 것입니다.";
  } catch (err) { note($("msg"), "실패: " + err.message, "bad"); }
}

function render(shown) {
  const tbody = $("rows");
  tbody.innerHTML = "";
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="9" style="color:var(--mut)">구좌가 없습니다.</td></tr>'; return; }
  for (const s of rows) {
    const live = s.is_active ? (shown[s.section_id] ?? s.live_count) : s.live_count;
    const thin = s.is_active && s.slot_type === "editorial" && live < 12;
    const tr = document.createElement("tr");
    if (!s.is_active) tr.className = "off";
    tr.innerHTML = `
      <td class="num">${s.sort_order}</td>
      <td><code>${s.section_id}</code></td>
      <td>${s.slot_type}</td>
      <td>${s.display_type === "trending" ? '<span class="tag trending">trending</span>' : '<span class="tag">default</span>'}</td>
      <td>${escapeHtml(s.title)}</td>
      <td class="num">${s.product_ids.length}</td>
      <td class="num ${thin ? "warn" : ""}">${live}${thin ? " ⚠" : ""}</td>
      <td>${s.is_active ? '<span class="ok">on</span>' : "off"}</td>
      <td><button data-id="${s.section_id}" data-g="${s.gender}">편집</button></td>`;
    tr.querySelector("button").addEventListener("click", () => openEditor(s));
    tbody.appendChild(tr);
  }
}

function escapeHtml(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }

function openEditor(s) {
  $("editor").hidden = false;
  $("editorTitle").textContent = s ? `편집 · ${s.section_id} / ${s.gender}` : "새 구좌";
  $("f_section_id").value = s?.section_id ?? "";
  $("f_gender").value = s?.gender ?? $("gender").value;
  $("f_slot_type").value = s?.slot_type ?? "editorial";
  $("f_display_type").value = s?.display_type ?? "default";
  $("f_title").value = s?.title ?? "";
  $("f_subtitle").value = s?.subtitle ?? "";
  $("f_sort_order").value = s?.sort_order ?? 100;
  $("f_is_active").checked = s?.is_active ?? false;
  $("f_product_ids").value = (s?.product_ids ?? []).join(", ");
  $("thumbs").innerHTML = "";
  note($("editorMsg"), "");
  syncAutoHint();
  $("editor").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function syncAutoHint() {
  const isAuto = $("f_slot_type").value === "auto";
  $("autoHint").hidden = !isAuto;
  $("f_product_ids").disabled = isAuto;
}
$("f_slot_type").addEventListener("change", syncAutoHint);

function parseIds(text) {
  return [...new Set((text.match(/\d+/g) || []).map(Number))];
}

async function checkProducts() {
  const ids = parseIds($("f_product_ids").value);
  if (!ids.length) { note($("editorMsg"), "ID가 없습니다.", "warn"); return; }
  note($("editorMsg"), "확인 중…");
  try {
    const data = await api(`/products?gender=${$("f_gender").value}&ids=${ids.join(",")}`);
    const bad = data.products.filter((p) => !p.eligible).length;
    $("thumbs").innerHTML = data.products.map((p) => `
      <div class="thumb ${p.eligible ? "" : "bad"}">
        <img src="${escapeHtml(p.image_url)}" alt="" loading="lazy" />
        <div>${p.product_id}</div>
        <div>${escapeHtml(p.brand)}</div>
        ${p.eligible ? "" : '<div class="bad">노출 불가</div>'}
      </div>`).join("");
    const parts = [`${data.products.length}개 조회`];
    if (bad) parts.push(`${bad}개 노출 불가`);
    if (data.missing.length) parts.push(`없는 ID ${data.missing.join(", ")}`);
    note($("editorMsg"), parts.join(" · "), bad || data.missing.length ? "warn" : "ok");
  } catch (err) { note($("editorMsg"), "실패: " + err.message, "bad"); }
}

async function save() {
  const payload = {
    section_id: $("f_section_id").value.trim(),
    gender: $("f_gender").value,
    slot_type: $("f_slot_type").value,
    display_type: $("f_display_type").value,
    title: $("f_title").value.trim(),
    subtitle: $("f_subtitle").value.trim() || null,
    sort_order: Number($("f_sort_order").value || 100),
    is_active: $("f_is_active").checked,
    product_ids: parseIds($("f_product_ids").value),
  };
  note($("editorMsg"), "저장 중…");
  try {
    const saved = await api("/sections", { method: "PUT", body: JSON.stringify(payload) });
    note($("editorMsg"), `저장됨 · 노출 가능 ${saved.live_count}개`, "ok");
    await load();
  } catch (err) { note($("editorMsg"), "실패: " + err.message, "bad"); }
}

async function remove() {
  const id = $("f_section_id").value.trim(), g = $("f_gender").value;
  if (!confirm(`${id} / ${g} 행을 삭제합니다. 되돌릴 수 없습니다.\n숨기기만 하려면 활성 체크를 끄고 저장하세요.`)) return;
  try {
    await api(`/sections/${encodeURIComponent(id)}/${g}`, { method: "DELETE" });
    $("editor").hidden = true;
    await load();
  } catch (err) { note($("editorMsg"), "실패: " + err.message, "bad"); }
}

$("reload").addEventListener("click", load);
$("gender").addEventListener("change", load);
$("newSection").addEventListener("click", () => openEditor(null));
$("closeEditor").addEventListener("click", () => { $("editor").hidden = true; });
$("checkProducts").addEventListener("click", checkProducts);
$("save").addEventListener("click", save);
$("del").addEventListener("click", remove);
if ($("token").value) load();
</script>
</body>
</html>
